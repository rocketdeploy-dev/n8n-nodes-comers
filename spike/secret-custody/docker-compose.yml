# M7 secret-custody spike: a real n8n in queue mode (main + worker) on
# PostgreSQL and Redis, with the spike extension loaded as a custom node.
# Isolated project; nothing here is shared with any other stack.
name: m7-custody

x-n8n: &n8n
  image: n8nio/n8n:${N8N_VERSION:-2.40.5}
  environment: &n8n-env
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: n8n-spike-db
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    N8N_ENCRYPTION_KEY: ${SPIKE_ENCRYPTION_KEY:-m7-custody-spike-encryption-key-0001}
    N8N_CUSTOM_EXTENSIONS: /opt/custody
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_SECURE_COOKIE: "false"
    N8N_LOG_LEVEL: debug
    N8N_RUNNERS_ENABLED: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    N8N_WEBHOOK_URL: http://localhost:5679/
  volumes:
    - ./extension:/opt/custody:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n-spike-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
  n8n:
    <<: *n8n
    ports:
      - "127.0.0.1:5679:5678"
  worker:
    <<: *n8n
    command: worker
    depends_on:
      n8n: { condition: service_started }
