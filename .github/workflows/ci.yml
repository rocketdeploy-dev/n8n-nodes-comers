name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the community node package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Pinned, and pinned to the same version in publish.yml. Verifying a PR
      # on one npm and publishing on another is how an npm 12 change to
      # `npm pack --json` reached publishing without CI ever seeing it.
      - name: Use the pinned npm
        run: npm install --global npm@12.0.2

      - name: Report the toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The official scanner, run against this working copy. The published
      # form (`npx @n8n/scan-community-package <name>`) can only judge a
      # release that already exists, which is too late to be a gate.
      - name: Scan as an n8n community package
        run: npm run scan

      - name: Check what publishing would upload
        run: npm run pack:check
